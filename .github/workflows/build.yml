name: check-and-build

on:
  push:
    branches: [main]
    tags: ['v*-pre.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_name: ${{ steps.metadata.outputs.build_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and release version
        id: metadata
        run: python3 tool/release_metadata.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - name: Analyze (errors and warnings are fatal; existing style infos are advisory)
        run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
      - name: Test actual browser platform services
        run: flutter test --platform chrome test/web_startup_test.dart --reporter expanded
      - name: Require unchanged dependency lock
        run: git diff --exit-code -- pubspec.lock

  web:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/release_metadata.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - name: Build for the GitHub Pages project path
        run: flutter build web --release --no-pub --base-href /taipei-safe-walk-townpass/ --no-web-resources-cdn
      - name: Package website
        run: |
          cp assets/build-info.json build/web/build-info.json
          touch build/web/.nojekyll
          mkdir -p artifacts
          cd build/web
          zip -qr ../../artifacts/taipei-safe-walk-townpass-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-web
          path: artifacts/taipei-safe-walk-townpass-web.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: build/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  android:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/release_metadata.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - name: Build test-signed release APK
        run: flutter build apk --release --no-pub --build-name '${{ needs.check.outputs.version }}' --build-number "$GITHUB_RUN_NUMBER"
      - name: Verify and stage APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/taipei-safe-walk-townpass-android-prerelease.apk
      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-android
          path: artifacts/taipei-safe-walk-townpass-android-prerelease.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    needs: check
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/release_metadata.py
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - name: Build unsigned iPhone device app
        run: flutter build ios --release --no-codesign --no-pub --build-name '${{ needs.check.outputs.build_name }}' --build-number "$GITHUB_RUN_NUMBER"
      - name: Package and verify unsigned IPA
        run: |
          APP=build/ios/iphoneos/Runner.app
          test -f "$APP/Runner"
          test ! -d "$APP/_CodeSignature"
          if codesign --verify "$APP" 2>/dev/null; then
            echo 'Expected an unsigned app.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload" artifacts
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          ditto -c -k --keepParent "$RUNNER_TEMP/ipa/Payload" artifacts/taipei-safe-walk-townpass-ios-unsigned.ipa
          unzip -t artifacts/taipei-safe-walk-townpass-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-ios
          path: artifacts/taipei-safe-walk-townpass-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/release_metadata.py
      - uses: actions/download-artifact@v4
        with:
          pattern: prerelease-*
          path: artifacts
          merge-multiple: true
      - name: Check all packages and generate checksums
        run: |
          cp assets/build-info.json artifacts/build-info.json
          cd artifacts
          test -s taipei-safe-walk-townpass-android-prerelease.apk
          test -s taipei-safe-walk-townpass-ios-unsigned.ipa
          test -s taipei-safe-walk-townpass-web.zip
          sha256sum *.apk *.ipa *.zip build-info.json > SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --prerelease \
            --target "$GITHUB_SHA" --title "Town Pass Preview $GITHUB_REF_NAME" \
            --notes-file docs/PRERELEASE-NOTES.md

  pages-settings:
    if: github.event_name != 'pull_request'
    needs: [web, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      configured: ${{ steps.settings.outputs.configured }}
    steps:
      - name: Check owner-configured GitHub Pages settings
        id: settings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$GH_REPO/pages" --jq '.build_type' > "$RUNNER_TEMP/pages-type.txt"; then
            if grep -qx workflow "$RUNNER_TEMP/pages-type.txt"; then
              echo 'configured=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'configured=false' >> "$GITHUB_OUTPUT"
          echo 'GitHub Pages is not configured for Actions. A repository owner must enable it.' >> "$GITHUB_STEP_SUMMARY"

  pages:
    needs: pages-settings
    if: needs.pages-settings.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: website
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
