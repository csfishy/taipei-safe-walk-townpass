name: Isolated demo database verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  reset-ci-database:
    name: Reset isolated CI database twice and verify safety
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-disposable-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # These credentials exist only in this job's disposable local service.
      # This reusable workflow accepts no Supabase or Demo secrets.
      RESET_DATABASE_ENVIRONMENT: ci
      RESET_DATABASE_PROJECT_ID: local-ci
      RESET_DATABASE_URL: postgresql://safe_walk_demo_reset:ci-disposable-password@127.0.0.1:5432/safe_walk_ci?sslmode=disable
      RESET_TEST_DATABASE_URL: postgresql://safe_walk_demo_reset:ci-disposable-password@127.0.0.1:5432/safe_walk_ci?sslmode=disable
      RESET_TEST_ADMIN_URL: postgresql://postgres:ci-admin-disposable-password@127.0.0.1:5432/safe_walk_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database test dependencies
        run: python3 -m pip install --requirement scripts/requirements-db-test.txt
      - name: Prepare the disposable CI database and restricted reset role
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-admin-disposable-password
        run: |
          # The PostGIS image initializes its default DB. Use template0 so the
          # test DB can install PostGIS in the reviewed extensions namespace.
          psql -X --set ON_ERROR_STOP=1 --dbname postgres \
            --command 'CREATE DATABASE safe_walk_ci TEMPLATE template0;'
          psql -X --set ON_ERROR_STOP=1 --dbname safe_walk_ci \
            --set ci_password=ci-disposable-password \
            --file supabase/demo/bootstrap_ci.sql
      - name: Reset only the isolated CI database
        run: python3 scripts/reset_demo_database.py --environment ci
      - name: Require database integration tests and safety regression tests
        run: |
          # Both integration URLs above are local; missing configuration must
          # not silently turn this required CI job into skipped DB tests.
          test -n "$RESET_TEST_DATABASE_URL"
          test -n "$RESET_TEST_ADMIN_URL"
          python3 -m unittest discover -s scripts/tests -v
